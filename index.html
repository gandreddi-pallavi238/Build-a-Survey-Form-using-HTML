<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Survey Form</title>

    <!-- Link External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Survey Form</h1>
    <p>Please fill out this survey form honestly.</p>

    <form action="#" method="post">

        <!-- Name -->
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <!-- Age -->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" required>

        <!-- Email -->
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <!-- Gender -->
        <label>Gender:</label>
        <div class="options">
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </div>

        <!-- Course Interest -->
        <label>Courses You Are Interested In:</label>
        <div class="options">
            <input type="checkbox" id="html" name="course[]" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="course[]" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" id="js" name="course[]" value="JavaScript">
            <label for="js">JavaScript</label>

            <input type="checkbox" id="python" name="course[]" value="Python">
            <label for="python">Python</label>
            
            <input type="checkbox" id="other" name="course[]" value="Other">
            <label for="Other">other</label>
        </div>

        <!-- Education Level -->
        <label for="education">Highest Qualification:</label>
        <select id="education" name="education">
            <option value="School">School</option>
            <option value="Diploma">Diploma</option>
            <option value="Undergraduate">Undergraduate</option>
            <option value="Postgraduate">Postgraduate</option>
        </select>

        <!-- Feedback -->
        <label for="feedback">Your Feedback:</label>
        <textarea id="feedback" name="feedback" rows="4"></textarea>

        <!-- Buttons -->
        <div class="buttons">
            <input type="submit" value="Submit Survey">
            <input type="reset" value="Reset">
        </div>

    </form>

</body>
</html>
